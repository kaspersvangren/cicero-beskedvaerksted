<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beskedværkstedet v0.2</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: værktøjslinje øverst, to kolonner (editor | forhåndsvisning) fra 980px, én kolonne på mobil.
   Farver: kølig papir-neutral, blækblå felt-brikker (datostempel), blomme = lister, havgrøn = betingelser. */
:root {
  --paper: #f2f4f7;
  --card: #ffffff;
  --ink: #1a2330;
  --muted: #5b6878;
  --line: #d6dde6;
  --line-strong: #b9c3cf;
  --accent: #2a4f9b;
  --accent-ink: #ffffff;
  --accent-soft: #e4ebf8;
  --field: #24468c;
  --field-soft: #e7edfa;
  --field-line: #b7c7ea;
  --list: #7a3e8f;
  --list-soft: #f5ecf8;
  --cond: #1d7364;
  --cond-soft: #e3f3ef;
  --code: #4f5761;
  --code-soft: #eef1f4;
  --warn: #8f5100;
  --warn-soft: #fff2dd;
  --err: #b3261e;
  --err-soft: #fde9e7;
  --ok: #2f7d3a;
  --shadow: 0 1px 2px rgba(20, 35, 60, .06), 0 6px 20px rgba(20, 35, 60, .06);
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-label: "IBM Plex Sans Condensed", "IBM Plex Sans", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #11151b; --card: #181e26; --ink: #e5eaf0; --muted: #98a4b3; --line: #2a333e; --line-strong: #3b4655;
    --accent: #8fb0ff; --accent-ink: #0d1424; --accent-soft: #1d2840;
    --field: #a9c1ff; --field-soft: #1e2a45; --field-line: #34497a;
    --list: #dcaaeb; --list-soft: #2b2033; --cond: #74d3bf; --cond-soft: #14302a;
    --code: #c0c7cf; --code-soft: #212831; --warn: #f2b45a; --warn-soft: #3a2b13; --err: #ff8f86; --err-soft: #3c1c1a; --ok: #7ccf86;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #11151b; --card: #181e26; --ink: #e5eaf0; --muted: #98a4b3; --line: #2a333e; --line-strong: #3b4655;
  --accent: #8fb0ff; --accent-ink: #0d1424; --accent-soft: #1d2840;
  --field: #a9c1ff; --field-soft: #1e2a45; --field-line: #34497a;
  --list: #dcaaeb; --list-soft: #2b2033; --cond: #74d3bf; --cond-soft: #14302a;
  --code: #c0c7cf; --code-soft: #212831; --warn: #f2b45a; --warn-soft: #3a2b13; --err: #ff8f86; --err-soft: #3c1c1a; --ok: #7ccf86;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font: 15px/1.5 var(--f-body); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.wrap { max-width: 1440px; margin: 0 auto; padding-inline: 16px; padding-block: 0 48px; }

/* ---------- topbar ---------- */
.topbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding-block: 16px 12px; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand h1 { margin: 0; font: 600 22px/1.1 var(--f-label); letter-spacing: .01em; text-wrap: balance; }
.brand .sub { color: var(--muted); font: 13px var(--f-label); letter-spacing: .04em; text-transform: uppercase; }
.brand .ver { font: 12px var(--f-mono); color: var(--muted); }
.topbar .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-left: auto; }

.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-strong); background: var(--card); color: var(--ink);
  border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 14px; line-height: 1.3; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); background: var(--code-soft); }
.btn.small { padding: 3px 8px; font-size: 13px; }
.btn.danger { color: var(--err); }
.btn[disabled] { opacity: .45; cursor: default; }
.icon { width: 16px; height: 16px; flex: none; }

/* ---------- setup bar ---------- */
.setup { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px 20px; align-items: end; background: var(--card);
  border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; box-shadow: var(--shadow); }
.setup label.lbl, .lbl { display: block; font: 600 12px var(--f-label); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.setup select { width: 100%; max-width: 640px; padding: 7px 10px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--card); }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 6px; overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; background: var(--card); padding: 6px 12px; cursor: pointer; border-right: 1px solid var(--line); font-size: 14px; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.keyline { grid-column: 1 / -1; font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 14px; }
.keyline code { font: 12.5px var(--f-mono); color: var(--ink); background: var(--code-soft); padding: 1px 6px; border-radius: 4px; overflow-wrap: anywhere; }
@media (max-width: 700px) { .setup { grid-template-columns: 1fr; } }

/* ---------- main grid ---------- */
.main { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 20px; margin-top: 16px; align-items: start; }
@media (max-width: 980px) { .main { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); min-width: 0; }
.panel-h { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.panel-h h2 { margin: 0; font: 600 15px var(--f-label); letter-spacing: .03em; text-transform: uppercase; }
.panel-b { padding: 14px; }
.preview-col { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
@media (max-width: 980px) { .preview-col { position: static; } }

/* ---------- variants ---------- */
.vtabs { display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 14px 0; border-bottom: 1px solid var(--line); }
.vtab { border: 1px solid var(--line); border-bottom: 0; background: var(--paper); border-radius: 6px 6px 0 0; padding: 6px 12px; cursor: pointer;
  font-size: 14px; display: inline-flex; gap: 6px; align-items: center; margin-bottom: -1px; max-width: 100%; }
.vtab[aria-selected="true"] { background: var(--card); border-color: var(--line); font-weight: 600; }
.vtab .live { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
.vtab span.t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vhead { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 14px; background: var(--cond-soft); border-bottom: 1px solid var(--line); }
.vhead .when { font-size: 14px; }
.vhead .when b { color: var(--cond); }
.vhead .sp { flex: 1; }

/* ---------- toolbar ---------- */
.tools { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
  padding: 8px 14px; background: var(--card); border-bottom: 1px solid var(--line); }
.tools .hint { font-size: 12.5px; color: var(--muted); margin-left: auto; }
.tools .btn.t-field { color: var(--field); border-color: var(--field-line); background: var(--field-soft); }
.tools .btn.t-list { color: var(--list); }
.tools .btn.t-if { color: var(--cond); }

/* ---------- editor ---------- */
.ed { padding: 14px; display: grid; gap: 14px; }
.row-subject { display: grid; gap: 4px; }
.blocks { display: grid; gap: 6px; min-width: 0; }
.run { min-height: 1.6em; padding: 6px 8px; border-radius: 6px; border: 1px dashed transparent; white-space: pre-wrap; overflow-wrap: anywhere;
  outline: none; line-height: 1.75; min-width: 0; }
.run:hover { border-color: var(--line); }
.run:focus { border-color: var(--accent); background: color-mix(in srgb, var(--accent-soft) 35%, transparent); }
.run.is-empty { min-height: 1.2em; padding-block: 2px; }
.run.is-empty::before { content: attr(data-ph); color: var(--muted); font-size: 13px; pointer-events: none; }
.run.gap.is-empty { min-height: 10px; padding-block: 0; }
.run.gap.is-empty::before { content: ""; }
.run.gap.is-empty:hover::before { content: attr(data-ph); }
.run.is-empty:focus::before { content: ""; }
.run.subject { border: 1px solid var(--line-strong); background: var(--card); font-weight: 600; white-space: nowrap; overflow-x: auto; }
.run.body-root { border: 1px solid var(--line); }

.chip { display: inline-flex; align-items: baseline; gap: 4px; padding: 0 7px; margin: 0 1px; border-radius: 4px; cursor: pointer; user-select: none;
  font-size: 13.5px; line-height: 1.55; white-space: nowrap; vertical-align: baseline; border: 1px solid; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.chip-field { color: var(--field); background: var(--field-soft); border-color: var(--field-line); }
.chip-field .fmt { font: 11.5px var(--f-mono); opacity: .8; }
.chip-field.unknown { color: var(--err); background: var(--err-soft); border-color: var(--err); }
.chip-plural { color: var(--cond); background: var(--cond-soft); border-color: color-mix(in srgb, var(--cond) 45%, transparent); }
.chip-expr { color: var(--code); background: var(--code-soft); border-color: var(--line-strong); font: 12.5px var(--f-mono); }
.chip:hover { filter: brightness(.97); box-shadow: 0 0 0 2px color-mix(in srgb, currentColor 25%, transparent); }

.blk { border-radius: 8px; border: 1px solid var(--line); min-width: 0; }
.blk-h { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; padding: 6px 8px 6px 12px; font-size: 14px; border-radius: 8px 8px 0 0; }
.blk-h .k { font: 600 12px var(--f-label); text-transform: uppercase; letter-spacing: .07em; }
.blk-h .sp { flex: 1; }
.blk-b { padding: 6px 8px 8px 14px; }
.blk-list { border-color: color-mix(in srgb, var(--list) 40%, var(--line)); border-left: 4px solid var(--list); }
.blk-list > .blk-h { background: var(--list-soft); color: var(--list); }
.blk-if { border-color: color-mix(in srgb, var(--cond) 40%, var(--line)); border-left: 4px solid var(--cond); }
.blk-if > .blk-h, .blk-if > .br-h { background: var(--cond-soft); color: var(--cond); }
.br-h { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; padding: 6px 8px 6px 12px; font-size: 14px; border-top: 1px solid color-mix(in srgb, var(--cond) 25%, var(--line)); }
.br-h .k { font: 600 12px var(--f-label); text-transform: uppercase; letter-spacing: .07em; }
.br-h .sp { flex: 1; }
.blk-code { border-left: 4px solid var(--code); background: var(--code-soft); }
.blk-code > .blk-h { color: var(--code); }
.blk-code textarea { width: 100%; border: 0; background: transparent; font: 13px/1.5 var(--f-mono); resize: vertical; padding: 4px 12px 10px; min-height: 2.6em; }
.blk-note { border-style: dashed; background: transparent; }
.blk-note > .blk-h { color: var(--muted); }
.blk-note input { width: 100%; border: 0; background: transparent; font-style: italic; padding: 2px 12px 8px; color: var(--muted); }
.condbtn { border: 1px solid color-mix(in srgb, var(--cond) 45%, transparent); background: var(--card); color: var(--ink); border-radius: 5px; padding: 2px 8px;
  cursor: pointer; font-size: 14px; text-align: left; max-width: 100%; overflow-wrap: anywhere; }
.condbtn:hover { border-color: var(--cond); }
.pathbtn { border: 1px solid color-mix(in srgb, var(--list) 45%, transparent); background: var(--card); color: var(--ink); border-radius: 5px; padding: 2px 8px; cursor: pointer; font-size: 14px; }
.asinput { width: auto; border: 1px solid var(--line-strong); border-radius: 5px; padding: 1px 6px; font: 13px var(--f-mono); background: var(--card); }
.iconbtn { border: 0; background: transparent; color: inherit; opacity: .7; cursor: pointer; padding: 3px 5px; border-radius: 4px; font-size: 14px; line-height: 1; }
.iconbtn:hover { opacity: 1; background: color-mix(in srgb, currentColor 12%, transparent); }

.frame { border: 1px dashed var(--line-strong); border-radius: 8px; font-size: 13px; color: var(--muted); }
.frame summary { cursor: pointer; padding: 6px 10px; }
.frame pre { margin: 0; padding: 8px 10px; font: 12px/1.45 var(--f-mono); overflow-x: auto; color: var(--code); }

.notes { border-radius: 8px; padding: 10px 12px; background: var(--warn-soft); color: var(--ink); font-size: 14px; display: grid; gap: 4px; }
.notes b { color: var(--warn); }
.notes ul { margin: 0; padding-left: 18px; }

/* ---------- preview ---------- */
.pv-tabs { display: inline-flex; gap: 2px; background: var(--paper); border-radius: 6px; padding: 2px; }
.pv-tabs button { border: 0; background: transparent; padding: 4px 10px; border-radius: 5px; cursor: pointer; font-size: 14px; }
.pv-tabs button[aria-selected="true"] { background: var(--card); box-shadow: var(--shadow); font-weight: 600; }
.testdata { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: end; padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--paper); font-size: 14px; }
.testdata .f { display: grid; gap: 2px; min-width: 0; }
.testdata .f label { font: 600 11px var(--f-label); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.testdata select, .testdata input[type="text"] { padding: 4px 8px; border: 1px solid var(--line-strong); border-radius: 5px; background: var(--card); }
.testdata input[type="text"] { width: 13em; max-width: 100%; }
.testdata .chk { display: inline-flex; gap: 6px; align-items: center; padding-bottom: 4px; }
.testdata .lnk { margin-left: auto; }
.tdjson { width: 100%; min-height: 220px; font: 12px/1.45 var(--f-mono); border: 1px solid var(--line-strong); border-radius: 6px; padding: 8px; background: var(--card); }

.mail { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.mail-h { padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--paper); display: grid; gap: 2px; font-size: 14px; }
.mail-h .s { font-weight: 600; font-size: 16px; overflow-wrap: anywhere; }
.mail-h .meta { color: var(--muted); font-size: 12.5px; }
.mail-b { padding: 12px 14px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 15px; line-height: 1.55; min-height: 120px; }
.mail-b.html { white-space: normal; background: #fff; color: #111; }
.vbadge { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--cond); background: var(--cond-soft); border-radius: 999px; padding: 2px 10px; }
.sms { max-width: 340px; background: var(--field-soft); color: var(--ink); border-radius: 16px 16px 16px 4px; padding: 10px 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
.smsmeta { font-size: 13px; color: var(--muted); margin-top: 6px; font-variant-numeric: tabular-nums; }
.smsmeta b.warn { color: var(--warn); }
.err { background: var(--err-soft); color: var(--ink); border-left: 4px solid var(--err); padding: 10px 12px; border-radius: 6px; font-size: 14px; }
.err b { color: var(--err); }
.lint { display: grid; gap: 6px; margin-top: 12px; }
.lint .w { background: var(--warn-soft); border-left: 4px solid var(--warn); padding: 8px 10px; border-radius: 6px; font-size: 13.5px; }
.lint .w code { font: 12.5px var(--f-mono); overflow-wrap: anywhere; }

.codeview { margin: 0; font: 12.5px/1.6 var(--f-mono); overflow-x: auto; background: var(--code-soft); border-radius: 6px; padding: 10px 0; counter-reset: ln; }
.codeview .l { display: block; padding: 0 12px 0 0; white-space: pre; }
.codeview .l::before { counter-increment: ln; content: counter(ln); display: inline-block; width: 3.2em; padding-right: 10px; text-align: right; color: var(--muted); opacity: .6; }
.codeview .l.hl { background: var(--err-soft); }
.codeview .tg { color: var(--cond); }
.codeview .ip { color: var(--field); }
.codeview .cm { color: var(--muted); font-style: italic; }
.where { font-size: 13px; color: var(--muted); display: grid; gap: 4px; margin-top: 12px; }
.where code { font: 12px var(--f-mono); color: var(--ink); background: var(--code-soft); border-radius: 4px; padding: 1px 5px; overflow-wrap: anywhere; }

/* ---------- modal ---------- */
.modal-bg { position: fixed; inset: 0; background: rgba(10, 16, 26, .45); z-index: 50; display: flex; align-items: flex-start; justify-content: center;
  padding: calc(env(safe-area-inset-top, 0px) + 5vh) 16px 16px; overflow-y: auto; }
.modal { background: var(--card); color: var(--ink); border-radius: 10px; width: min(680px, 100%); box-shadow: 0 20px 60px rgba(0, 0, 0, .35); display: grid; max-height: 88vh; grid-template-rows: auto minmax(0, 1fr) auto; }
.modal.wide { width: min(900px, 100%); }
.modal-h { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.modal-h h3 { margin: 0; font: 600 18px var(--f-label); flex: 1; min-width: 0; overflow-wrap: anywhere; }
.modal-b { padding: 14px 16px; overflow-y: auto; display: grid; gap: 12px; align-content: start; }
.modal-f { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; padding: 12px 16px; border-top: 1px solid var(--line); }
.modal-f .left { margin-right: auto; }
.fld { display: grid; gap: 4px; }
.fld > span { font: 600 12px var(--f-label); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.fld input[type="text"], .fld input[type="number"], .fld select, .fld textarea { width: 100%; padding: 7px 10px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--card); }
.fld textarea { font: 13px/1.5 var(--f-mono); min-height: 260px; }
.fld .help { font-size: 13px; color: var(--muted); }
.inline { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.inline > * { min-width: 0; }

.picker-search { position: sticky; top: 0; background: var(--card); padding-bottom: 6px; z-index: 1; }
.picker-search input { width: 100%; padding: 9px 12px; border: 1px solid var(--line-strong); border-radius: 6px; font-size: 15px; background: var(--card); }
.pgroup { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.pgroup > summary { cursor: pointer; padding: 8px 12px; background: var(--paper); font-weight: 600; font-size: 14px; display: flex; gap: 8px; align-items: center; }
.pgroup > summary .cnt { color: var(--muted); font-weight: 400; font-size: 12.5px; margin-left: auto; }
.pgroup.loop > summary { background: var(--list-soft); color: var(--list); }
.pitem { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 7px 12px; border-top: 1px solid var(--line); cursor: pointer; align-items: center; }
.pitem:hover, .pitem:focus { background: var(--field-soft); outline: none; }
.pitem .d { font-size: 14.5px; overflow-wrap: anywhere; }
.pitem .crumb { font-size: 12px; color: var(--muted); grid-column: 1; overflow-wrap: anywhere; }
.pitem .p { font: 11.5px var(--f-mono); color: var(--muted); grid-column: 1; overflow-wrap: anywhere; }
.pitem .ex { font-size: 12.5px; color: var(--muted); text-align: right; grid-row: 1 / span 3; grid-column: 2; max-width: 14em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pitem .tag { font: 600 10.5px var(--f-label); text-transform: uppercase; letter-spacing: .06em; padding: 1px 6px; border-radius: 4px; background: var(--list-soft); color: var(--list); margin-left: 6px; }
.pitem.sub { padding-left: 28px; }
.pitem.sub2 { padding-left: 44px; }
.pacts { display: flex; gap: 6px; padding: 6px 12px 8px 28px; flex-wrap: wrap; border-top: 1px solid var(--line); background: var(--list-soft); }

.crow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: start; padding: 10px; border: 1px solid var(--line); border-radius: 8px; }
.crow .ctl { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.crow select, .crow input[type="text"], .crow input[type="number"] { padding: 5px 8px; border: 1px solid var(--line-strong); border-radius: 5px; background: var(--card); max-width: 100%; }
.crow textarea { width: 100%; min-height: 70px; font: 12.5px var(--f-mono); padding: 6px 8px; border: 1px solid var(--line-strong); border-radius: 5px; background: var(--card); }
.crow .not { display: inline-flex; gap: 4px; align-items: center; font-size: 13px; color: var(--muted); padding-top: 6px; }
.csum { padding: 8px 10px; background: var(--cond-soft); border-radius: 6px; font-size: 14px; }
.csum b { color: var(--cond); }
.saved { display: grid; gap: 6px; }
.saved .s { display: flex; gap: 8px; align-items: center; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; }
.saved .s .n { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.saved .s .d { color: var(--muted); font-size: 13px; }

.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); transform: translateX(-50%); background: var(--ink); color: var(--paper);
  padding: 10px 16px; border-radius: 8px; z-index: 60; font-size: 14px; max-width: calc(100% - 32px); box-shadow: 0 10px 30px rgba(0, 0, 0, .3); }
.jump { position: fixed; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); z-index: 20; display: none; }
@media (max-width: 980px) { .jump { display: inline-flex; } }
.muted { color: var(--muted); }
.mono { font-family: var(--f-mono); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

      for (let k = t.start; k < t.end; k++) if (!strip[k]) v += src[k];
      t.value = v;
    }
    return toks;
  }

  // ---------- Udtryk ----------
  const OPS = ['..<', '..!', '..*', '->', '??', '==', '!=', '<=', '>=', '&&', '||', '..', '+=', '-=', '++', '--',
    '!', '=', '<', '>', '+', '-', '*', '/', '%', '(', ')', '[', ']', '{', '}', ',', ':', '.', '?', ';'];

  function lexExpr(s, base) {
    const out = [];
    let i = 0;
    while (i < s.length) {
      const c = s[i];
      if (/\s/.test(c)) { i++; continue; }
      const st = i;
      if (c === '"' || c === "'" || (c === 'r' && (s[i + 1] === '"' || s[i + 1] === "'"))) {
        const raw = c === 'r';
        if (raw) i++;
        const q = s[i]; i++;
        let v = '';
        while (i < s.length && s[i] !== q) {
          if (!raw && s[i] === '\\') {
            const e = s[i + 1];
            const map = { n: '\n', t: '\t', r: '\r', '\\': '\\', '"': '"', "'": "'", $: '$', '{': '{', l: '<', g: '>', a: '&', f: '\f', b: '\b' };
            if (e === 'x') {
              const hm = /^[0-9a-fA-F]{1,4}/.exec(s.slice(i + 2));

            }

          }

        if (i >= s.length) throw new FtlError('Tekststreng er ikke afsluttet', base + st);
        i++;

      }
      let m;
      if ((m = /^\d+(\.\d+)?/.exec(s.slice(i))) && !(s[i - 1] === '.' && s[i - 2] === '.' && false)) {
        // undgå at "1..5" bliver 1. og .5

        if (m[1] && s[i + num.length - m[1].length] === '.' && s[i + num.length - m[1].length + 1] === '.') num = m[0].replace(m[1], '');
        if (/^\d+\.$/.test(num)) num = num.slice(0, -1);
        if (s.slice(i).startsWith(num + '..')) { /* ok */ }
        out.push({ t: 'num', v: parseFloat(num), pos: base + st, end: base + st + num.length });
        i += num.length; continue;
      }
      if ((m = /^[\p{L}_$@][\p{L}\p{N}_$@]*/u.exec(s.slice(i)))) {
        out.push({ t: 'id', v: m[0], pos: base + st, end: base + st + m[0].length });
        i += m[0].length; continue;
      }
      if (c === '\\' && (m = /^\\(lte|lt|gte|gt)\b/.exec(s.slice(i)))) {
        out.push({ t: 'id', v: m[1], pos: base + st, end: base + st + m[0].length });
        i += m[0].length; continue;
      }
      let op = null;
      for (const o of OPS) if (s.startsWith(o, i)) { op = o; break; }
      if (!op) throw new FtlError('Ukendt tegn i udtryk: ' + c, base + i);
      out.push({ t: 'op', v: op, pos: base + st, end: base + st + op.length });
      i += op.length;
    }
    out.push({ t: 'eof', pos: base + s.length, end: base + s.length });
    return out;
  }

  function parseExpr(s, base, opts) {
    base = base || 0;
    const toks = lexExpr(s, base);
    let p = 0;
    const peek = (k) => toks[p + (k || 0)];
    const isOp = (v, k) => { const t = peek(k); return t.t === 'op' && t.v === v; };
    const isId = (v, k) => { const t = peek(k); return t.t === 'id' && t.v === v; };
    const eat = (v) => { if (!isOp(v)) throw new FtlError('Forventede "' + v + '" i udtrykket', peek().pos); return toks[p++]; };
    const srcOf = (a, b) => s.slice(a - base, b - base);
    const mk = (node, a) => { node.pos = a; node.end = toks[p - 1].end; node.src = srcOf(a, node.end); return node; };

    function parseOr() {
      const a = peek().pos; let l = parseAnd();
      while (isOp('||') || isId('or')) { p++; const r = parseAnd(); l = mk({ k: 'or', l, r }, a); }

    }
    function parseAnd() {
      const a = peek().pos; let l = parseEq();
      while (isOp('&&') || isId('and')) { p++; const r = parseEq(); l = mk({ k: 'and', l, r }, a); }
      return l;
    }
    function parseEq() {
      const a = peek().pos; let l = parseRel();
      while (isOp('==') || isOp('!=') || (isOp('=') && !(opts && opts.assign))) {
        const op = toks[p++].v; const r = parseRel(); l = mk({ k: 'cmp', op: op === '=' ? '==' : op, l, r }, a);

    function parseRel() {
      const a = peek().pos; let l = parseRange();

        else if (isId('lt')) op = '<'; else if (isId('lte')) op = '<='; else if (isId('gt')) op = '>'; else if (isId('gte')) op = '>=';
        if (!op) break;
        p++; const r = parseRange(); l = mk({ k: 'cmp', op, l, r }, a);

    }
    function parseRange() {
      const a = peek().pos; const l = parseAdd();
      if (isOp('..') || isOp('..<') || isOp('..!') || isOp('..*')) {
        const op = toks[p++].v;
        let r = null;
        const t = peek();
        if (!(t.t === 'eof' || (t.t === 'op' && (t.v === ']' || t.v === ')' || t.v === ',')))) r = parseAdd();
        return mk({ k: 'range', op, l, r }, a);
      }
      return l;
    }
    function parseAdd() {
      const a = peek().pos; let l = parseMul();
      while (isOp('+') || isOp('-')) { const op = toks[p++].v; const r = parseMul(); l = mk({ k: 'arith', op, l, r }, a); }
      return l;
    }
    function parseMul() {
      const a = peek().pos; let l = parseUnary();
      while (isOp('*') || isOp('/') || isOp('%')) { const op = toks[p++].v; const r = parseUnary(); l = mk({ k: 'arith', op, l, r }, a); }
      return l;
    }
    function parseUnary() {
      const a = peek().pos;
      if (isOp('!')) { p++; const e = parseUnary(); return mk({ k: 'not', e }, a); }
      if (isOp('-')) { p++; const e = parseUnary(); return mk({ k: 'neg', e }, a); }
      if (isOp('+')) { p++; return parseUnary(); }
      return parsePostfix();
    }
    function canStartPrimary(t) {
      if (t.t === 'str' || t.t === 'num') return true;
      if (t.t === 'id') return !['as', 'gt', 'gte', 'lt', 'lte', 'using', 'and', 'or'].includes(t.v);
      if (t.t === 'op') return t.v === '(' || t.v === '[' || t.v === '{' || t.v === '.';

    }
    function parsePostfix() {
      const a = peek().pos;
      let e = parsePrimary();
      for (;;) {
        if (isOp('.') && peek(1).t === 'id') { p++; const name = toks[p++].v; e = mk({ k: 'dot', e, name }, a); continue; }
        if (isOp('[')) { p++; const idx = parseOr(); eat(']'); e = mk({ k: 'index', e, idx }, a); continue; }
        if (isOp('?') && peek(1).t === 'id') {
          p++; const name = toks[p++].v; let args = null;
          if (isOp('(')) { p++; args = []; if (!isOp(')')) { args.push(parseOr()); while (isOp(',')) { p++; args.push(parseOr()); } } eat(')'); }
          else if (name === 'string' && isOp('[')) { p++; args = [parseOr()]; eat(']'); }
          e = mk({ k: 'bi', e, name, args }, a); continue;
        }
        if (isOp('??')) { p++; e = mk({ k: 'exists', e }, a); continue; }
        if (isOp('(') && (e.k === 'var' || e.k === 'dot')) {
          p++; const args = []; if (!isOp(')')) { args.push(parseOr()); while (isOp(',')) { p++; args.push(parseOr()); } } eat(')');
          e = mk({ k: 'call', e, args }, a); continue;
        }
        if (isOp('!') && !isOp('=', 1)) {
          p++;
          let d = null;
          if (canStartPrimary(peek())) d = parsePostfixNoDefault();

        }
        break;
      }
      return e;
    }
    function parsePostfixNoDefault() {
      const a = peek().pos;
      let e = parsePrimary();
      for (;;) {
        if (isOp('.') && peek(1).t === 'id') { p++; const name = toks[p++].v; e = mk({ k: 'dot', e, name }, a); continue; }
        if (isOp('[')) { p++; const idx = parseOr(); eat(']'); e = mk({ k: 'index', e, idx }, a); continue; }
        if (isOp('?') && peek(1).t === 'id') {
          p++; const name = toks[p++].v; let args = null;
          if (isOp('(')) { p++; args = []; if (!isOp(')')) { args.push(parseOr()); while (isOp(',')) { p++; args.push(parseOr()); } } eat(')'); }
          else if (name === 'string' && isOp('[')) { p++; args = [parseOr()]; eat(']'); }
          e = mk({ k: 'bi', e, name, args }, a); continue;
        }
        break;
      }
      return e;
    }
    function parsePrimary() {
      const t = peek(); const a = t.pos;
      if (t.t === 'str') { p++; return mk({ k: 'str', v: t.v, raw: t.raw }, a); }
      if (t.t === 'num') { p++; return mk({ k: 'num', v: t.v }, a); }
      if (t.t === 'id') {
        p++;

        if (t.v === 'false') return mk({ k: 'bool', v: false }, a);

      }
      throw new FtlError('Uventet "' + (t.v != null ? t.v : 'slut') + '" i udtrykket', t.pos);
    }
    const api = { parseOr, peek, isOp, isId, eat, toks, get p() { return p; }, set p(v) { p = v; } };
    if (opts && opts.custom) return opts.custom(api);
    const e = parseOr();
    if (peek().t !== 'eof') throw new FtlError('Uventet "' + peek().v + '" i udtrykket', peek().pos);
    return e;
  }

  // ---------- Parser (skabelon) ----------
  const BLOCK_DIRS = new Set(['if', 'list', 'switch', 'compress', 'attempt', 'macro', 'function', 'noparse', 'items', 'escape', 'noescape', 'autoesc', 'noautoesc', 'outputformat']);

      if (t.type === 'interp') {
        cur.push({ type: 'interp', expr: parseExpr(t.expr, t.exprStart), start: t.start, end: t.end });
        continue;
      }
      if (t.type === 'macro' || t.type === 'macroend') { cur.push({ type: 'unknown', name: '@' + t.name, start: t.start, end: t.end }); continue; }

      if (t.type === 'dir') {
        const n = t.name;

          const node = { type: 'if', branches: [{ cond: parseExpr(t.params, pBase, { inTag: true }), body: [], tagStart: t.start, tagEnd: t.end }], elseBody: null, start: t.start, end: null };
          cur.push(node); stack.push({ node, cur: node.branches[0].body, kind: 'if' });
        } else if (n === 'elseif') {
          const fr = top(); if (fr.kind !== 'if') throw new FtlError('<#elseif> uden <#if>', t.start, src);
          const br = { cond: parseExpr(t.params, pBase, { inTag: true }), body: [], tagStart: t.start, tagEnd: t.end };
          fr.node.branches.push(br); fr.cur = br.body;
        } else if (n === 'else') {
          const fr = top();
          if (fr.kind === 'if') { fr.node.elseBody = []; fr.node.elseTag = [t.start, t.end]; fr.cur = fr.node.elseBody; }
          else if (fr.kind === 'list') { fr.node.elseBody = []; fr.cur = fr.node.elseBody; }
          else throw new FtlError('<#else> uden <#if> eller <#list>', t.start, src);
        } else if (n === 'list') {
          const m = /^([\s\S]+?)\s+as\s+([\p{L}_$][\p{L}\p{N}_$]*)(?:\s*,\s*([\p{L}_$][\p{L}\p{N}_$]*))?\s*$/u.exec(t.params);
          if (!m) throw new FtlError('<#list> skal have formen <#list noget as navn>', t.start, src);
          const node = { type: 'list', seq: parseExpr(m[1], pBase), v: m[2], v2: m[3] || null, body: [], elseBody: null, start: t.start, end: null, tagStart: t.start, tagEnd: t.end };
          cur.push(node); stack.push({ node, cur: node.body, kind: 'list' });

          cur.push({ type: 'setting', name: m[1], expr: parseExpr(m[2], pBase + t.params.indexOf(m[2])), start: t.start, end: t.end });
        } else if (n === 'switch') {

          cur.push({ type: 'break', start: t.start, end: t.end });
        } else if (n === 'compress') {
          const node = { type: 'compress', body: [], start: t.start, end: null }; cur.push(node); stack.push({ node, cur: node.body, kind: 'compress' });
        } else if (n === 'attempt') {
          const node = { type: 'attempt', body: [], recover: [], start: t.start, end: null }; cur.push(node); stack.push({ node, cur: node.body, kind: 'attempt' });
        } else if (n === 'recover') {
          const fr = top(); if (fr.kind !== 'attempt') throw new FtlError('<#recover> uden <#attempt>', t.start, src);

        } else if (n === 'ftl' || n === 't' || n === 'lt' || n === 'rt' || n === 'nt' || n === 'flush') {

        } else if (BLOCK_DIRS.has(n) && !t.selfClose) {
          const node = { type: 'unknown', name: '#' + n, body: [], start: t.start, end: null, block: true };
          cur.push(node); stack.push({ node, cur: node.body, kind: 'unknown:' + n });
        } else {
          cur.push({ type: 'unknown', name: '#' + n, start: t.start, end: t.end });
        }
        continue;
      }
      if (t.type === 'end') {
        const fr = top();
        const expect = { if: 'if', list: 'list', capture: fr.dirName, switch: 'switch', compress: 'compress', attempt: 'attempt' }[fr.kind] || (fr.kind && fr.kind.startsWith('unknown:') ? fr.kind.slice(8) : null);

        fr.node.end = t.end; fr.node.endTag = [t.start, t.end];

    }

  }

  function parseAssigns(p, pBase, at, src) {
    return parseExpr(p, pBase, {
      custom(api) {

  }

  // ---------- Evaluering ----------
  const MISSING = { missing: true, toString() { return '[mangler]'; } };
  class FtlDate { constructor(d, kind) { this.d = d; this.kind = kind; } }

  const LOCALES = {
    da: { months: ['januar', 'februar', 'marts', 'april', 'maj', 'juni', 'juli', 'august', 'september', 'oktober', 'november', 'december'], days: ['søndag', 'mandag', 'tirsdag', 'onsdag', 'torsdag', 'fredag', 'lørdag'], tag: 'da-DK' },
    en: { months: ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'], days: ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'], tag: 'en-US' },
    sv: { months: ['januari', 'februari', 'mars', 'april', 'maj', 'juni', 'juli', 'augusti', 'september', 'oktober', 'november', 'december'], days: ['söndag', 'måndag', 'tisdag', 'onsdag', 'torsdag', 'fredag', 'lördag'], tag: 'sv-SE' },
    nb: { months: ['januar', 'februar', 'mars', 'april', 'mai', 'juni', 'juli', 'august', 'september', 'oktober', 'november', 'desember'], days: ['søndag', 'mandag', 'tirsdag', 'onsdag', 'torsdag', 'fredag', 'lørdag'], tag: 'nb-NO' },
    de: { months: ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'], days: ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'], tag: 'de-DE' },
    fo: { months: ['januar', 'februar', 'mars', 'apríl', 'mai', 'juni', 'juli', 'august', 'september', 'oktober', 'november', 'desember'], days: ['sunnudagur', 'mánadagur', 'týsdagur', 'mikudagur', 'hósdagur', 'fríggjadagur', 'leygardagur'], tag: 'fo-FO' }
  };
  function locInfo(loc) {
    const l = String(loc || 'da').toLowerCase().split(/[_-]/)[0];
    return LOCALES[l === 'no' || l === 'nn' ? 'nb' : l] || LOCALES.en;
  }
  const pad = (n, w) => String(n).padStart(w, '0');
  function formatDate(d, pattern, loc) {
    const L = locInfo(loc);
    let out = '', i = 0;
    while (i < pattern.length) {
      const c = pattern[i];
      if (c === "'") {

          case 'L': out += n >= 4 ? L.months[d.getMonth()] : n === 3 ? L.months[d.getMonth()].slice(0, 3) : pad(d.getMonth() + 1, n); break;
          case 'y': out += n === 2 ? pad(d.getFullYear() % 100, 2) : pad(d.getFullYear(), n); break;

          case 'H': out += pad(d.getHours(), n); break;
          case 'h': out += pad(d.getHours() % 12 || 12, n); break;
          case 'm': out += pad(d.getMinutes(), n); break;

  // ---------- tekstfelter med brikker ----------

  // del teksten ved markøren og indsæt en blok

  function suggestVar(lf) {

  function insertPlural() {

  // ---------- menu / dialoger ----------

  const PRIO = ['title', 'author', 'returnDate', 'latestPickupDate', 'reservationPickupInformation', 'periodicalName', 'itemNumber', 'materialNumber',
    'loanDate', 'dateOfInterest', 'queueNumber', 'amount', 'dueDate', 'text', 'classification', 'name'];

      const search = h('input', { type: 'search', placeholder: 'Søg, fx "titel", "afhentning", "navn"', 'aria-label': 'Søg i felter' });

            shown.map((f) => { const it = item(v + f.path.slice(full.length), f, 0); const cr = crumbOf(f).split(' › ').slice(-(f.path.split('.').length - full.split('.').length - 1)).join(' › '); if (cr) it.insertBefore(h('span', { class: 'crumb' }, cr), it.children[1]); return it; })));

  function openTestJson() {
    modal('Testdata', (body) => {
      body.append(h('p', { class: 'muted', style: { margin: 0 } }, 'Her kan du rette de data, forhåndsvisningen bruger. Datoer skrives som 2026-10-13T12:00:00.000Z.'));
      const ta = h('textarea', { id: 'td-json', class: 'tdjson', spellcheck: 'false' });
      ta.value = S.test.json || JSON.stringify(CAT.buildData(type(), { count: S.test.count, lang: S.test.lang, groups: S.test.groups.split(',').map((s) => s.trim()).filter(Boolean), child: S.test.child, periodical: S.test.periodical, libraryName: S.settings.libraryName }), null, 2);
      body.append(ta, h('div', { id: 'td-err' }));
    }, (foot, close) => {
      foot.append(h('button', { class: 'btn left', onclick: () => { S.test.json = null; close(); renderPreviewOnly(); saveStore(); } }, 'Brug standarddata'),
        h('button', { class: 'btn', onclick: close }, 'Annullér'),
        h('button', { class: 'btn primary', onclick: () => {
          const v = $('#td-json').value;
          try { JSON.parse(v); } catch (e) { $('#td-err').replaceChildren(h('div', { class: 'err' }, 'Ugyldig JSON: ' + e.message)); return; }
          S.test.json = v; close(); renderPreviewOnly(); saveStore();
        } }, 'Brug'));
    }, { wide: true });
  }

  function currentCode() { return MODEL.generate(toModel(msg), type()); }

  function renderPreview() {
    const body = $('#pv-body');
    if (!body) return;
    const t = type();
    const model = toModel(msg);
    let code = '', out = '', err = null, vi = -1;
    try { code = MODEL.generate(model, t); } catch (e) { err = e; }
    const data = testData();
    if (!err) {
      try { out = FTL.render(code, data); } catch (e) { err = e; }
      try {
        const probe = MODEL.generate(model, t, { probe: true });
        const m = /\u00a7(\d+)\u00a7/.exec(FTL.render(probe, data));
        vi = m ? +m[1] : -1;
      } catch (e) { vi = -1; }
    }
    const prevV = lastRender.variant;
    lastRender = { out, err, variant: vi, code };
    if (prevV !== vi) document.querySelectorAll('.vtab').forEach((el, i) => {
      const dot = el.querySelector('.live');
      if (i === vi && !dot) el.prepend(h('span', { class: 'live', title: 'Det er denne variant, forhåndsvisningen viser' }));
      if (i !== vi && dot) dot.remove();
    });
    body.replaceChildren();
    if (view === 'code') {
      const lines = code.split('\n');
      const pre = h('pre', { class: 'codeview', 'aria-label': 'FreeMarker-kode' });
      lines.forEach((l, i) => { const el = h('span', { class: 'l' + (err && err.line === i + 1 ? ' hl' : ''), html: hl(l) }); pre.append(el); });
      if (err) body.append(errorBox(err));
      body.append(pre);
    } else {
      if (msg.variants.length > 1 && vi >= 0) body.append(h('div', { style: { marginBottom: '10px' } }, h('span', { class: 'vbadge' }, 'Viser varianten: ' + variantLabel(msg.variants[vi], vi))));
      if (err) body.append(errorBox(err));
      else body.append(renderOutput(out));
    }
    body.append(lintBox(model));
    const key = t.keys[msg.protocol];
    body.append(h('div', { class: 'where' },
      h('div', null, h('b', null, 'Sæt den ind i Cicero:')),
      h('div', null, 'Mobile: Admin → Notifikationer → "' + t.title + '" → skabelonen for ' + CAT.PROTOCOLS[msg.protocol].label + '.'),
      key ? h('div', null, 'LMS: F7 → Serveropsætning → ', h('code', null, key)) : null,
      h('div', null, 'Brug Ciceros egen Forhåndsvisning, før du gemmer. Den er facit.')));
  }
  function hl(line) {
    const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    let s = esc(line);
    s = s.replace(/(&lt;#--.*?--&gt;)/g, '\u0001cm\u0002$1\u0003');
    s = s.replace(/(&lt;\/?#[^&]*?(?:&gt;|$))/g, (m) => m.includes('\u0001') ? m : '\u0001tg\u0002' + m + '\u0003');
    s = s.replace(/(\$\{[^}]*\})/g, '\u0001ip\u0002$1\u0003');
    return s.replace(/\u0001(\w+)\u0002/g, '<span class="$1">').replace(/\u0003/g, '</span>');
  }
  function errorBox(e) {
    return h('div', { class: 'err', style: { marginBottom: '10px' } }, h('b', null, 'Cicero ville stoppe her' + (e.line ? ' (linje ' + e.line + ')' : '') + ': '), e.message,
      view !== 'code' && e.line ? h('div', null, h('button', { class: 'btn small', style: { marginTop: '6px' }, onclick: () => { view = 'code'; renderPreviewOnly(); } }, 'Vis i koden')) : null);
  }
  function renderOutput(out) {
    const proto = CAT.PROTOCOLS[msg.protocol];
    let text = out.replace(/^\s+/, '');
    if (msg.protocol === 'SMS') {
      const t = text.replace(/\s+$/, '');
      const gsm = /^[@£$¥èéùìòÇ\nØø\rÅåΔ_ΦΓΛΩΠΨΣΘΞÆæßÉ !"#¤%&'()*+,\-./0-9:;<=>?¡A-ZÄÖÑÜ§¿a-zäöñüà^{}\\[~\]|€]*$/.test(t);
      const ext = (t.match(/[\^{}\\[~\]|€]/g) || []).length;
      const len = t.length + (gsm ? ext : 0);
      const per = gsm ? (len <= 160 ? 160 : 153) : (len <= 70 ? 70 : 67);
      const parts = Math.max(1, Math.ceil(len / per));
      return h('div', null, h('div', { class: 'sms' }, t || ' '),
        h('div', { class: 'smsmeta' }, len + ' tegn · ', parts > 1 ? h('b', { class: 'warn' }, parts + ' SMS\'er') : '1 SMS', gsm ? '' : ' · indeholder tegn, der gør SMS\'en kortere (fx emoji)'));
    }
    let subject = '', rest = text;
    if (proto.subject) { const i = text.indexOf('\n'); subject = (i < 0 ? text : text.slice(0, i)).trim(); rest = i < 0 ? '' : text.slice(i + 1); }
    const mail = h('div', { class: 'mail' }, h('div', { class: 'mail-h' }, h('span', { class: 'meta' }, proto.label + ' · emne'), h('span', { class: 's' }, subject || h('span', { class: 'muted' }, '(intet emne)'))));
    if (msg.format !== 'text') {
      const host = h('div', { class: 'mail-b html' });
      try {
        const root = host.attachShadow({ mode: 'open' });
        root.innerHTML = '<style>:host{display:block;font:15px/1.5 system-ui,sans-serif;color:#111}</style>' + rest.replace(/<script[\s\S]*?<\/script>/gi, '');
      } catch (e) { host.textContent = rest; }
      mail.append(host);
    } else mail.append(h('div', { class: 'mail-b' }, rest.replace(/\s+$/, '')));
    return mail;
  }
  function lintBox(model) {
    const t = type();
    const warns = [];
    const seen = new Set();
    const check = (path, scope, where) => {
      if (!path) return;
      const full = resolve(path, scope);
      if (!/^data\./.test(full) || t.byPath[full] || seen.has(full)) return;
      // tillad dele af stier (fx data.reservations[0])
      if (t.fields.some((f) => f.path.startsWith(full + '.'))) return;
      seen.add(full);
      warns.push(h('div', { class: 'w' }, 'Feltet ', h('code', null, path), ' findes ikke i "' + t.title + '"' + (where ? ' (' + where + ')' : '') + '. Cicero vil vise en fejl eller ingenting.'));
    };
    const scanCode = (code, scope) => { (code.match(/\bdata(\.[\p{L}_$][\p{L}\p{N}_$]*|\[\d+\])+/gu) || []).forEach((p) => check(p, scope, 'i kode')); };
    const condPaths = (c, scope) => { if (!c) return; if (c.path) check(c.path, scope, 'i betingelse'); if (c.c) condPaths(c.c, scope); (c.items || []).forEach((x) => condPaths(x, scope)); if (c.k === 'raw') scanCode(c.code || '', scope); };
    const walk = (nodes, scope) => (nodes || []).forEach((n) => {
      if (n.t === 'field' || n.t === 'plural') check(n.path, scope);
      if (n.t === 'expr' || n.t === 'code') scanCode(n.code, scope);
      if (n.t === 'list') { check(n.path, scope, 'i liste'); walk(n.body, Object.assign({}, scope, { [n.as]: resolve(n.path, scope) })); }
      if (n.t === 'if') { n.branches.forEach((b) => { condPaths(b.cond, scope); walk(b.body, scope); }); walk(n.else, scope); }
    });
    walk(model.prelude, {});
    model.variants.forEach((v) => { condPaths(v.cond, {}); walk(v.subject, {}); walk(v.head, {}); walk(v.body, {}); walk(v.tail, {}); });
    if (msg.protocol !== 'SMS' && model.variants.some((v) => !v.subject.length)) warns.push(h('div', { class: 'w' }, 'En variant har intet emne. Første linje i teksten bliver så emnet.'));
    if (/\b(200|100|50)\s*kr/.test(JSON.stringify(model.variants.map((v) => v.body))) && t.byPath['data.loanerBlockNoticeAmountThreshold']) warns.push(h('div', { class: 'w' }, 'Teksten nævner et fast beløb. Feltet "Konfigureret beløbsgrænse" følger med, hvis grænsen ændres i Cicero.'));
    return warns.length ? h('div', { class: 'lint' }, warns) : h('span');
  }
  function copyCode() {
    const code = currentCode();
    const done = () => toast('Kopieret. Sæt den ind i Cicero, og tjek med Ciceros forhåndsvisning.');
    const fallback = () => {
      view = 'code'; renderPreviewOnly();
      const pre = $('.codeview');
      if (pre) { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
      toast('Koden er markeret. Tryk Ctrl+C (eller Kopiér) for at kopiere.');
    };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(done, fallback);
      else fallback();
    } catch (e) { fallback(); }
  }

  document.addEventListener('DOMContentLoaded', init);
  if (document.readyState !== 'loading') init();
})();

</script>
