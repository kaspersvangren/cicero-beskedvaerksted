<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beskedværkstedet</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: beskeden i midten som en rigtig mail; til højre "Tilføj" eller indstillinger for det valgte.
   Farver: lyst papir, marineblæk, havblå accent; modul=blomme, felt=blå, ord der følger antallet=grøn. */
:root {
  --bg: #f4f6f9; --card: #ffffff; --paper: #ffffff; --ink: #1d2738; --muted: #6a7689; --line: #e2e7ef; --line2: #cfd7e3;
  --accent: #1f6fb2; --accent-ink: #ffffff; --accent-soft: #e7f0fa;
  --field: #2357a8; --field-soft: #eaf0fc; --mod: #8a3fa0; --mod-soft: #f6edfa; --who: #1e8063; --who-soft: #e4f5ee;
  --warn: #9a5a00; --warn-soft: #fff3df; --err: #b3261e; --err-soft: #fde9e7;
  --muted-soft: #eef1f5; --shadow: 0 1px 2px rgba(25,40,70,.06), 0 10px 30px rgba(25,40,70,.08);
  --f-head: "Rubik", system-ui, sans-serif; --f-body: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12161d; --card: #1a2029; --paper: #1f2631; --ink: #e8edf4; --muted: #9ba7b8; --line: #2a333f; --line2: #384353;
  --accent: #6fb1ef; --accent-ink: #0b1522; --accent-soft: #1b2b40; --field: #9dbcff; --field-soft: #1f2b45;
  --mod: #dcacee; --mod-soft: #2c2135; --who: #74d4b4; --who-soft: #15302a; --warn: #f3bb62; --warn-soft: #382a14; --err: #ff8f86; --err-soft: #3c1c1a;
  --muted-soft: #242c37; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.3); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #12161d; --card: #1a2029; --paper: #1f2631; --ink: #e8edf4; --muted: #9ba7b8; --line: #2a333f; --line2: #384353;
  --accent: #6fb1ef; --accent-ink: #0b1522; --accent-soft: #1b2b40; --field: #9dbcff; --field-soft: #1f2b45;
  --mod: #dcacee; --mod-soft: #2c2135; --who: #74d4b4; --who-soft: #15302a; --warn: #f3bb62; --warn-soft: #382a14; --err: #ff8f86; --err-soft: #3c1c1a;
  --muted-soft: #242c37; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.3); color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 16px/1.55 var(--f-body); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
.wrap { max-width: 1260px; margin: 0 auto; padding-inline: 20px; padding-block: 0 48px; }

.top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding-block: 18px 10px; }
.logo { display: flex; align-items: center; gap: 10px; }
.logo .mark { width: 36px; height: 36px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.logo h1 { margin: 0; font: 600 20px var(--f-head); }
.logo small { display: block; color: var(--muted); font-size: 13px; }
.logo .ver { font: 12px var(--f-mono); color: var(--muted); margin-left: 4px; }
.crumbs { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 15px; flex-wrap: wrap; }
.crumbs button { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; font-weight: 600; }
.sp { flex: 1; }
.btn { display: inline-flex; align-items: center; gap: 8px; border: 1.5px solid var(--line2); background: var(--card); border-radius: 10px; padding: 8px 15px; cursor: pointer; font-weight: 600; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.small { padding: 5px 11px; font-size: 14.5px; border-radius: 8px; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); background: var(--muted-soft); }
.btn[disabled] { opacity: .45; cursor: default; }
.ico { width: 18px; height: 18px; flex: none; }

/* forside */
.choose h2 { font: 600 26px var(--f-head); margin: 18px 0 4px; }
.choose p.l { color: var(--muted); margin: 0 0 20px; max-width: 70ch; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.mcard { text-align: left; border: 1.5px solid var(--line); background: var(--card); border-radius: 16px; padding: 18px; cursor: pointer; box-shadow: var(--shadow); display: grid; gap: 4px; }
.mcard:hover { border-color: var(--accent); }
.mcard h3 { margin: 0; font: 600 17px var(--f-head); }
.mcard p { margin: 0; color: var(--muted); font-size: 15px; }
.mcard .cat { font-size: 12.5px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.mcard.soon { cursor: default; box-shadow: none; background: transparent; border-style: dashed; }
.mcard.soon:hover { border-color: var(--line); }
.mcard .badge { justify-self: start; font-size: 12.5px; font-weight: 600; color: var(--muted); background: var(--muted-soft); border-radius: 999px; padding: 1px 9px; }
.later { margin-top: 26px; color: var(--muted); font-size: 15px; }
.later a { color: var(--accent); }

/* arbejdsflade */
.titlerow { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.titlerow h2 { margin: 0; font: 600 24px var(--f-head); text-wrap: balance; }
.titlerow .back { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; font-weight: 600; font-size: 15px; }
.work { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 22px; align-items: start; margin-top: 6px; }
@media (max-width: 980px) { .work { grid-template-columns: minmax(0, 1fr); } }
.viewas { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; font-size: 15px; color: var(--muted); }
.seg { display: inline-flex; background: var(--muted-soft); border-radius: 999px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 5px 14px; border-radius: 999px; cursor: pointer; font-weight: 600; color: var(--muted); font-size: 14.5px; }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }

.mail { background: var(--paper); border-radius: 18px; box-shadow: var(--shadow); border: 1px solid var(--line); overflow: hidden; }
.mhead { padding: 18px 26px 14px; border-bottom: 1px solid var(--line); display: grid; gap: 6px; }
.mhead .meta { font-size: 14px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.mhead .av { width: 30px; height: 30px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font: 600 13px var(--f-head); }
.subject { font: 600 21px/1.35 var(--f-head); outline: none; border-radius: 8px; padding: 2px 6px; margin-left: -6px; white-space: pre-wrap; overflow-wrap: anywhere; }
.subject:hover { background: var(--muted-soft); }
.subject:focus { background: var(--accent-soft); }
.mbody { padding: 14px 18px 26px; }
.errbar { margin: 12px 18px 0; background: var(--err-soft); border-left: 4px solid var(--err); border-radius: 8px; padding: 10px 12px; font-size: 14.5px; }

.sec { position: relative; border-radius: 12px; padding: 6px 8px; border: 1.5px solid transparent; transition: border-color .1s, background .1s; }
.sec:hover { border-color: var(--line); }
.sec.sel { border-color: var(--accent); background: color-mix(in srgb, var(--accent-soft) 35%, transparent); }
.sec.hidden { opacity: .45; }
.sec.hidden .content { text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--muted) 50%, transparent); }
.sec.dragging { opacity: .4; }
.bar { position: absolute; top: -14px; right: 10px; display: none; gap: 2px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 2px 6px; box-shadow: 0 2px 8px rgba(0,0,0,.08); z-index: 3; }
.sec:hover .bar, .sec.sel .bar, .sec:focus-within .bar { display: flex; }
.bar button { border: 0; background: transparent; cursor: pointer; padding: 3px 7px; border-radius: 999px; font-size: 13.5px; color: var(--muted); display: inline-flex; align-items: center; gap: 4px; }
.bar button:hover { background: var(--muted-soft); color: var(--ink); }
.bar .grip { cursor: grab; }
.tag { position: absolute; left: -2px; top: -11px; font: 600 11.5px var(--f-head); letter-spacing: .04em; text-transform: uppercase; padding: 1px 8px; border-radius: 999px; background: var(--who-soft); color: var(--who); border: 1px solid color-mix(in srgb, var(--who) 30%, transparent); }
.content { white-space: pre-wrap; overflow-wrap: anywhere; padding: 4px 6px; border-radius: 8px; outline: none; min-height: 1.55em; }
.content[contenteditable="true"]:focus { background: var(--card); box-shadow: inset 0 0 0 1.5px var(--line2); }
.mod { border-radius: 10px; background: color-mix(in srgb, var(--mod-soft) 45%, transparent); padding: 8px 10px; cursor: pointer; }
.mod .mlabel { font: 600 11.5px var(--f-head); letter-spacing: .05em; text-transform: uppercase; color: var(--mod); margin-bottom: 2px; display: flex; align-items: center; gap: 6px; }
.mod .content { padding: 2px 0; }
.chip { padding: 0 4px; border-radius: 6px; background: var(--field-soft); color: var(--field); cursor: pointer; border-bottom: 1.5px dashed color-mix(in srgb, var(--field) 50%, transparent); }
.chip.word { background: color-mix(in srgb, var(--who-soft) 70%, transparent); color: var(--who); border-bottom-color: color-mix(in srgb, var(--who) 50%, transparent); }
.chip.empty { color: var(--muted); font-style: italic; }
.chip.sel { box-shadow: 0 0 0 2px var(--accent); }
.gap { height: 8px; position: relative; display: flex; align-items: center; justify-content: center; }
.gap button { opacity: 0; border: 1.5px dashed var(--line2); background: var(--card); color: var(--muted); border-radius: 999px; padding: 0 12px; font-size: 13px; cursor: pointer; transition: opacity .1s; position: relative; z-index: 2; }
.gap:hover button, .gap button:focus { opacity: 1; }
.gap.over { height: 36px; }
.gap.over::before { content: ""; position: absolute; inset: 6px; border-radius: 10px; background: var(--accent-soft); border: 2px dashed var(--accent); }
body.dragging .gap { height: 18px; }

/* højre side */
.side { display: grid; gap: 14px; position: sticky; top: 14px; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.panel h3 { margin: 0; font: 600 17px var(--f-head); display: flex; align-items: center; gap: 8px; }
.panel .sub { margin: -6px 0 0; font-size: 14px; color: var(--muted); }
.adds { display: grid; gap: 8px; }
.add { display: flex; gap: 12px; align-items: center; text-align: left; border: 1.5px solid var(--line); background: var(--card); border-radius: 12px; padding: 9px 12px; cursor: grab; }
.add:hover { border-color: var(--accent); }
.add .sw { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; flex: none; }
.add b { display: block; font-size: 15.5px; }
.add small { color: var(--muted); font-size: 13.5px; }
.q { display: grid; gap: 6px; }
.q .l { font-weight: 600; font-size: 14.5px; }
.q .hint { font-size: 13.5px; color: var(--muted); }
.q input[type="text"], .q select { padding: 8px 10px; border: 1.5px solid var(--line2); border-radius: 10px; background: var(--card); width: 100%; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { border: 1.5px solid var(--line2); background: var(--card); border-radius: 999px; padding: 4px 12px; cursor: pointer; font-size: 14px; }
.pill[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.toggle { display: flex; align-items: center; gap: 10px; font-size: 15px; cursor: pointer; }
.toggle input { width: 18px; height: 18px; accent-color: var(--accent); }
.cols { display: grid; gap: 4px; }
.col { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--card); }
.col.on { border-color: color-mix(in srgb, var(--mod) 40%, var(--line)); background: color-mix(in srgb, var(--mod-soft) 50%, var(--card)); }
.col .grip { cursor: grab; color: var(--muted); padding: 0 2px; width: 14px; }
.col label { flex: 1; display: flex; gap: 8px; align-items: center; cursor: pointer; }
.col input { width: 17px; height: 17px; accent-color: var(--mod); }
.col .mv { border: 0; background: transparent; color: var(--muted); cursor: pointer; padding: 2px 6px; border-radius: 6px; }
.col .mv:hover { background: var(--muted-soft); color: var(--ink); }
.col.drop { border-style: dashed; border-color: var(--accent); }
.note { font-size: 14px; color: var(--muted); background: var(--muted-soft); border-radius: 10px; padding: 10px 12px; }
.note.warn { background: var(--warn-soft); color: var(--ink); }
.adv { font-size: 14px; }
.adv summary { cursor: pointer; color: var(--muted); }
.adv pre { margin: 8px 0 0; font: 12px/1.5 var(--f-mono); background: var(--muted-soft); border-radius: 8px; padding: 10px; overflow-x: auto; white-space: pre; max-height: 360px; }

/* menuer og dialoger */
.pop { position: fixed; z-index: 50; background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 16px 40px rgba(0,0,0,.18); padding: 8px; width: 290px; display: grid; gap: 2px; max-height: 70vh; overflow-y: auto; }
.pop .h { font-size: 12.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 6px 8px 2px; }
.pop button { border: 0; background: transparent; text-align: left; padding: 7px 10px; border-radius: 8px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; }
.pop button:hover, .pop button:focus { background: var(--accent-soft); outline: none; }
.pop button small { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 45%; }
.modal-bg { position: fixed; inset: 0; background: rgba(10,18,30,.45); z-index: 60; display: grid; place-items: start center; padding: 6vh 16px 16px; overflow-y: auto; }
.modal { background: var(--card); color: var(--ink); border-radius: 18px; width: min(640px, 100%); padding: 22px 24px; display: grid; gap: 14px; max-height: calc(100vh - 8vh - 16px); overflow-y: auto; overscroll-behavior: contain; box-shadow: 0 30px 70px rgba(0,0,0,.35); }
.modal.wide { width: min(820px, 100%); }
.modal h3 { margin: 0; font: 600 21px var(--f-head); }
.modal ol { margin: 0; padding-left: 22px; display: grid; gap: 8px; }
.modal code { font: 13px var(--f-mono); background: var(--muted-soft); padding: 1px 6px; border-radius: 5px; overflow-wrap: anywhere; }
.modal pre { margin: 0; font: 12.5px/1.5 var(--f-mono); background: var(--muted-soft); border-radius: 10px; padding: 12px; overflow: auto; max-height: 300px; white-space: pre; }
.modal .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.modal .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 600px) { .modal .grid2 { grid-template-columns: 1fr; } }
.search { width: 100%; padding: 9px 12px; border: 1.5px solid var(--line2); border-radius: 10px; background: var(--card); }
.flist { display: grid; gap: 2px; max-height: 50vh; overflow-y: auto; }
.flist button { border: 0; background: transparent; text-align: left; padding: 8px 10px; border-radius: 8px; cursor: pointer; display: grid; gap: 0; }
.flist button:hover, .flist button:focus { background: var(--accent-soft); outline: none; }
.flist small { color: var(--muted); font-size: 13px; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 10px; z-index: 70; font-size: 15px; max-width: calc(100% - 32px); }

/* v0.4: børnelånere og testdata */
.childset { display: grid; gap: 10px; border-top: 1px solid var(--line); padding-top: 14px; }
.childset h4 { margin: 0; font: 600 17px var(--f-head); }
.childset .sub { margin: -4px 0 2px; font-size: 14px; color: var(--muted); }
.q.indent { margin-left: 28px; }
.radios { display: grid; gap: 6px; }
.radio { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; }
.radio.on { border-color: var(--accent); background: var(--accent-soft, var(--muted-soft)); }
.radio input { margin-top: 3px; accent-color: var(--accent); }
.radio b { display: block; font-weight: 600; }
.radio small { display: block; color: var(--muted); font-size: 13.5px; }
.checks { display: grid; gap: 8px; }
.viewas .btn.small { margin-left: auto; }

</style>
</head>

        h('label', { class: 'toggle' }, h('input', { type: 'checkbox', checked: !!p.last, onchange: (e) => { p.last = e.target.checked; if (!p.first && !p.last) p.first = true; upd(); } }), 'Efternavn'),
        h('span', { class: 'hint' }, 'Cicero sender hele navnet. Fornavn er det første ord, efternavn det sidste. Mellemnavne og dobbelte efternavne kommer kun med, når begge er valgt.')),
        p.first ? h('div', { class: 'q' }, h('span', { class: 'l' }, 'Hvis navnet mangler, skriv'), h('input', { type: 'text', value: p.fb == null ? 'låner' : p.fb, onchange: (e) => { p.fb = e.target.value; upd(); } })) : null);
    } else if (p.c === 'word') {
      out.push(h('div', { class: 'q' }, h('span', { class: 'l' }, 'Når der er ét'), h('input', { type: 'text', value: p.one, onchange: (e) => { p.one = e.target.value; upd(); } })),
        h('div', { class: 'q' }, h('span', { class: 'l' }, 'Når der er flere'), h('input', { type: 'text', value: p.many, onchange: (e) => { p.many = e.target.value; upd(); } })),
        h('span', { class: 'hint' }, 'Skift mellem "Voksen, 1 lån" og "Voksen, 3 lån" øverst for at se begge.'));
    } else if (p.c === 'fixed') {
      out.push(h('div', { class: 'note' }, 'Værdien kommer fra opsætningen: "', S.settings[p.key] || '(tom)', '".'), h('button', { class: 'btn small', onclick: openSettings }, 'Ret opsætningen'));
    } else if (p.c === 'field') {
      const f = T().byPath[p.path];
      out.push(h('div', { class: 'q' }, h('span', { class: 'l' }, 'Hvis feltet er tomt, skriv'), h('input', { type: 'text', value: p.fb || '', placeholder: 'ingenting', onchange: (e) => { p.fb = e.target.value; upd(); } })));
      if (f && f.isDate) out.push(h('div', { class: 'q' }, h('span', { class: 'l' }, 'Datoen skrives som'), pills(KIT.DATE_FORMATS.map(([fm]) => [fm, FTL.formatDate(new Date(2026, 9, 23), fm, 'da')]), p.date, (k) => { p.date = k; upd(); })));
    } else if (p.c === 'lib') {
      out.push(h('div', { class: 'note' }, 'Navnet kommer fra Cicero, så det altid passer. Vil du have adresse eller telefon med, så tilføj afsnittet "Kontaktoplysninger".'));
    } else if (p.c === 'count') {
      out.push(h('div', { class: 'note' }, 'Skriver antallet som tal, fx "3".'));
    }
    out.push(h('button', { class: 'btn small', onclick: () => removeChip(p) }, 'Fjern feltet'));
    return [h('div', { class: 'panel' }, out)];
  }
  function removeChip(p) {
    const d = doc();
    snapshot();
    const i = d.subject.indexOf(p); if (i >= 0) d.subject.splice(i, 1);
    d.sections.forEach((s) => { if (s.parts) { const j = s.parts.indexOf(p); if (j >= 0) s.parts.splice(j, 1); } });
    sel = null; save(); render();
  }

  // ---------- kode, opsætning, kopiering ----------
  function code() { return MODEL.generate(KIT.toModel(doc(), M(), T(), settings(), S.protocol), T()); }
  function modal(title, build, wide) {
    const bg = h('div', { class: 'modal-bg' });
    const close = () => { bg.remove(); document.removeEventListener('keydown', esc); };
    const esc = (e) => { if (e.key === 'Escape') close(); };
    const box = h('div', { class: 'modal' + (wide ? ' wide' : ''), role: 'dialog', 'aria-label': title }, h('h3', null, title));
    let downOnBg = false;
    bg.addEventListener('mousedown', (e) => { downOnBg = e.target === bg && e.clientX < bg.clientWidth; });
    bg.addEventListener('click', (e) => { if (downOnBg && e.target === bg) close(); downOnBg = false; });
    document.addEventListener('keydown', esc);
    build(box, close);
    bg.append(box); document.body.append(bg);
    return close;
  }
  function openSettings() {
    modal('Opsætning', (b, close) => {
      b.append(h('p', { style: 'margin:0;color:var(--muted)' }, 'Bibliotekets faste oplysninger. De bruges i "Kontaktoplysninger" og i felter som hjemmeside og telefon. De gemmes kun i denne browser.'));
      const grid = h('div', { class: 'grid2' });
      SETTINGS_FIELDS.forEach(([k, l, ph]) => grid.append(h('label', { class: 'q' }, h('span', { class: 'l' }, l), h('input', { type: 'text', value: S.settings[k] || '', placeholder: ph, oninput: (e) => { S.settings[k] = e.target.value; save(); } }))));
      const kids = h('div', { class: 'childset' });
      const drawKids = () => kids.replaceChildren(...childSettings(drawKids).filter(Boolean));
      drawKids();
      b.append(grid, kids, h('div', { class: 'row' }, h('button', { class: 'btn primary', onclick: () => { close(); render(); } }, 'Færdig')));
    });
  }
  function childSettings(redraw) {
    const c = S.settings.child;
    const set = (k, v) => { c[k] = v; if (!c.age && !c.group) c[k === 'age' ? 'group' : 'age'] = true; save(); redraw(); };
    const both = c.age && c.group;
    return [
      h('h4', null, 'Hvem er børnelånere?'),
      h('p', { class: 'sub' }, 'Bruges i afsnit, der kun skal ses af børn eller kun af voksne. Alle, der ikke er børn, regnes som voksne, også hvis oplysningen mangler.'),
      h('label', { class: 'toggle' }, h('input', { type: 'checkbox', checked: !!c.age, onchange: (e) => set('age', e.target.checked) }), 'Alder: under 18 år, ud fra fødselsdatoen'),
      h('label', { class: 'toggle' }, h('input', { type: 'checkbox', checked: !!c.group, onchange: (e) => set('group', e.target.checked) }), 'Lånergruppe: navnet starter med …'),
      c.group ? h('label', { class: 'q indent' }, h('input', { type: 'text', value: c.groups || '', placeholder: 'Fx Børn', oninput: (e) => { c.groups = e.target.value; save(); hintEl.textContent = KIT.childRuleText(settings()); } }),
        h('span', { class: 'hint' }, 'Skriv begyndelsen af gruppens navn, som det hedder i Cicero. Flere navne adskilles med komma, fx "Børn, Skole". Store og små bogstaver er ligegyldige.')) : null,
      both ? h('div', { class: 'q' }, h('span', { class: 'l' }, 'Når begge er valgt'),
        h('div', { class: 'radios' }, Object.entries(KIT.CHILD_MODES).map(([k, [l, d]]) => h('label', { class: 'radio' + (c.mode === k ? ' on' : '') },
          h('input', { type: 'radio', name: 'childmode', checked: c.mode === k, onchange: () => set('mode', k) }), h('span', null, h('b', null, l), h('small', null, d)))))) : null,
      (hintEl = h('div', { class: 'note' }, KIT.childRuleText(settings())))
    ];
  }
  let hintEl = null;

  // ---------- testdata til Cicero ----------
  function testDataDialog() {
    const p = persona();
    const po = p.o || {};
    const st = { child: !!po.child, count: po.count || 2, per: Array.isArray(po.periodical), noPhone: p.id === 'm2', noDob: false };
    const hasList = !!M().list;
    modal('Testdata til Cicero', (b, close) => {
      const body = h('div', { style: 'display:grid;gap:14px' });
      let txt = '';
      const draw = () => {
        const extra = { child: st.child, noPhone: st.noPhone, noDob: st.noDob };
        if (hasList) { extra.count = st.count; extra.periodical = st.per ? [Math.min(1, st.count - 1)] : false; }
        const d = KIT.personaData(M(), T(), { o: {}, adult18: !!p.adult18 }, settings(), S.protocol, extra);
        txt = KIT.ciceroData(d);
        let kid = false; try { kid = KIT.isChild(M(), T(), d, settings()); } catch (e) { /* ignore */ }
        const upd = (k, v) => { st[k] = v; draw(); };
        body.replaceChildren(...[
          h('p', { style: 'margin:0;color:var(--muted)' }, 'Cicero viser forhåndsvisningen med nogle testdata, som man selv kan rette i. Her kan du lave nye, så du kan se beskeden for et barn, med flere lån osv. Det er de samme opdigtede data, som værkstedet bruger.'),
          h('div', { class: 'grid2' },
            h('div', { class: 'q' }, h('span', { class: 'l' }, 'Låneren'), pills([[false, 'Voksen'], [true, 'Barn']], st.child, (v) => upd('child', v)),
              h('span', { class: 'hint' }, st.child ? 'Under 18 år og i lånergruppen "' + (KIT.childRule(settings()).names[0] || 'Børn') + '".' : 'Voksen og i lånergruppen "Voksne".')),
            hasList ? h('div', { class: 'q' }, h('span', { class: 'l' }, 'Antal lån'), pills([1, 2, 3, 4, 5].map((n) => [n, String(n)]), st.count, (v) => upd('count', v))) : h('div')),
          h('div', { class: 'checks' },
            hasList ? h('label', { class: 'toggle' }, h('input', { type: 'checkbox', checked: st.per, onchange: (e) => upd('per', e.target.checked) }), 'Et af lånene er et tidsskrift') : null,
            h('label', { class: 'toggle' }, h('input', { type: 'checkbox', checked: st.noPhone, onchange: (e) => upd('noPhone', e.target.checked) }), 'Låneren mangler telefon og e-mail'),
            h('label', { class: 'toggle' }, h('input', { type: 'checkbox', checked: st.noDob, onchange: (e) => upd('noDob', e.target.checked) }), 'Låneren mangler fødselsdato')),
          h('div', { class: 'note' + (kid !== st.child ? ' warn' : '') }, 'Med jeres opsætning regnes låneren som ', h('b', null, kid ? 'barn' : 'voksen'), '. ', KIT.childRuleText(settings())),
          h('button', { class: 'btn primary', style: 'justify-self:start', onclick: () => copyText(txt, 'Testdata kopieret') }, ic('copy'), 'Kopiér testdata'),
          h('ol', null,
            h('li', null, 'Åbn skabelonen i Cicero, og find testdata ved forhåndsvisningen.'),
            h('li', null, 'Markér alle testdata, og sæt de kopierede ind i stedet.'),
            h('li', null, 'Opdatér forhåndsvisningen.')),
          h('details', { class: 'adv' }, h('summary', null, 'Se testdata (' + txt.trim().split('\n').length + ' linjer)'), h('pre', null, txt)),
          h('div', { class: 'row' }, h('button', { class: 'btn', onclick: close }, 'Luk'))].filter(Boolean));
      };
      draw();
      b.append(body);
    }, true);
  }
  function copyText(t, msg) {
    const fallback = () => { const det = document.querySelector('.modal details'); if (det) det.open = true; const pre = document.querySelector('.modal pre'); if (pre) { const r = document.createRange(); r.selectNodeContents(pre); const g = getSelection(); g.removeAllRanges(); g.addRange(r); toast('Teksten er markeret. Tryk Ctrl+C for at kopiere.'); } };
    try { navigator.clipboard.writeText(t).then(() => toast(msg || 'Kopieret'), fallback); } catch (e) { fallback(); }
  }
  function copyDialog() {
    const c = code();
    const t = T();
    const key = t.keys[S.protocol];
    let err = null; try { FTL.render(c, data()); } catch (e) { err = e; }
    const copy = () => {
      const ok = () => toast('Kopieret');
      try { navigator.clipboard.writeText(c).then(ok, () => selectPre()); } catch (e) { selectPre(); }
    };
    const selectPre = () => { const det = document.querySelector('.modal details'); if (det) det.open = true; const pre = document.querySelector('.modal pre'); if (pre) { const r = document.createRange(); r.selectNodeContents(pre); const g = getSelection(); g.removeAllRanges(); g.addRange(r); toast('Koden er markeret. Tryk Ctrl+C for at kopiere.'); } };
    modal('Sæt beskeden ind i Cicero', (b, close) => {
      if (err) b.append(h('div', { class: 'errbar', style: 'margin:0' }, h('b', null, 'Bemærk: '), err.message));
      b.append(h('button', { class: 'btn primary', style: 'justify-self:start', onclick: copy }, ic('copy'), 'Kopiér skabelonen'),
        h('ol', null,
          h('li', null, 'Gå til ', h('b', null, 'Admin → Notifikationer'), ' i Cicero, og find "', t.title, '".'),
          h('li', null, 'Vælg skabelonen for ', h('b', null, S.protocol === 'EMAIL' ? 'E-mail' : 'Digital Post'), '. I den gamle klient hedder nøglen ', h('code', null, key || '?'), '.'),
          h('li', null, 'Markér alt i feltet, og sæt den kopierede skabelon ind i stedet.'),
          h('li', null, 'Tryk ', h('b', null, 'Forhåndsvisning'), ' i Cicero. Ser den rigtig ud, så gem.')),
        h('p', { class: 'hint', style: 'margin:0;color:var(--muted);font-size:14px' }, 'Vil du se beskeden for et barn eller med flere lån i Cicero? ', h('a', { href: '#', onclick: (e) => { e.preventDefault(); close(); testDataDialog(); } }, 'Lav testdata til Cicero'), '.'),
        h('details', { class: 'adv' }, h('summary', null, 'Se koden'), h('pre', null, c)),
        h('div', { class: 'row' }, h('button', { class: 'btn', onclick: close }, 'Luk')));
    }, true);
  }

  render();
})();

</script>
</body>
</html>
